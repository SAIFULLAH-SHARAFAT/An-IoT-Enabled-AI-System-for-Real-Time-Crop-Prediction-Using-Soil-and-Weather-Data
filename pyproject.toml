[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-recommendation"
version = "1.0.0"
description = "IoT-enabled AI system for real-time crop prediction from soil and weather data (Habiganj, Bangladesh)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "MD Shaifullah Sharafat" },
    { name = "Nilavro Das Kabya" },
    { name = "Rahimul Islam Emu" },
    { name = "Mehrab Uddin Ahmed" },
    { name = "Jakaria Chowdhury Onik" },
    { name = "Mohammad Aminul Islam" },
    { name = "Riasat Khan" },
]
keywords = ["crop recommendation", "precision agriculture", "ensemble learning", "IoT", "ThingsBoard", "Raspberry Pi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
deep = ["torch>=2.1", "pytorch-tabnet>=4.1", "optuna>=3.4"]
explain = ["lime>=0.2.0.1"]
edge = ["pymodbus>=3.5", "requests>=2.31"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-requests",
]
all = ["crop-recommendation[deep,explain,edge]"]

[project.urls]
Repository = "https://github.com/SAIFULLAH-SHARAFAT/An-IoT-Enabled-AI-System-for-Real-Time-Crop-Prediction-Using-Soil-and-Weather-Data"
Paper = "https://doi.org/10.1016/j.atech.2025.101263"

[project.scripts]
crop-rec = "crop_recommendation.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crop_recommendation = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PT", "T20"]
ignore = ["N803", "N806", "N812"]  # X / X_train and `functional as F` are conventional in ML code

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "PT012", "PT018", "E501"]
"scripts/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["crop_recommendation"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: trains real models on the full dataset (deselect with -m 'not slow')",
    "deep: requires the optional deep-learning dependencies",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["crop_recommendation"]
branch = true
